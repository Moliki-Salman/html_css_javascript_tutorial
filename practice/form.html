<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
  </head>
  <body>
    <form action="">
      <div>
        <label for="fname">First Name</label>
        <input type="text" />
      </div>
      <div>
        <label for="lname">Last Name</label>
        <input type="text" name="lname" id="lname" />
      </div>
      <div>
        <label for="email">email</label>
        <input type="email" name="email" id="email" />
      </div>
      <div>
        <label for="cars">Choose a car:</label>
        <select name="cars" id="cars">
          <option value="volvo">volvo</option>
          <option value="tesla">tesla</option>
        </select>
      </div>
      <div>
        <input type="checkbox" id="vehicle1" name="vehicle1">
        <label for="vehicle1">I have a bike</label> <br>
        <input type="checkbox" id="vehicle2" name="vehicle2">
        <label for="vehicle1">I have a boat</label>
      </div>
      <div>
        <P>What is your favorite language?</P>
        <input type="radio" name="fav_language" id="html" value="HTML" >
        <label for="html">HTML</label> <br>
        <input type="radio" name="fav_language" id="css" value="CSS">
        <label for="html">CSS</label> <br>
        <input type="radio" name="fav_language" id="javascript" value="JAVASCRIPT">
        <label for="html">Javascript</label> <br>
      </div>
      <label for="css">upload a document</label>
      <input type="file" name="date" id="time">
      <div>
        <div>
            <textarea name="comment" >Enter your passcode</textarea>
        </div>
        <div>
            <input type="submit" value="Submit">
        </div>

      </div>
    </form>
  </body>
</html>
