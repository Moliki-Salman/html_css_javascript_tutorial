<!DOCTYPE html>
<html>
  <head>
    <script type="application/javascript">
      function checkdata() {
        // assign the element to a variable
        var username = document.getElementById("name");
        var emailid = document.getElementById("email");

        //check if the username feild form is empty
        if (username.value == "") {
          alert("Please enter the name");
          username.focus();
          return false;
          //check if the email  feild form is empty
        } else if (emailid.value == "") {
          alert("Please enter the email");
          emailid.focus();
          return false;
        }
        // if the forms are not empty, return true
        return true;
      }
    </script>
    <title>Contact Details</title>
  </head>
  <body>
    <h2>Enter your contact details:</h2>
    <br>

    <!-- the return  statement is important before calling the checkdata() function -->
    <form id="form1" onsubmit="return checkdata()">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" />
      <br><br>
      <label for="email">Email Address:</label>
      <input type="text" id="email" name="email" />
      <br><br>
      <input type="submit" value="Submit"/>
      <input type="reset" value="Reset"/>
    </form>
  </body>
</html>
